services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    container_name: local-ai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-local_ai_workspace}
      POSTGRES_USER: ${POSTGRES_USER:-local_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_ai_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - local_ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  local_ai_postgres_data:
