spring:
  application:
    name: localrag
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/local_ai_workspace}
    username: ${DB_USERNAME:local_ai}
    password: ${DB_PASSWORD:local_ai_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:qwen3:8b}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}
      init:
        pull-model-strategy: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
