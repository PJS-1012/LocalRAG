spring:
  application:
    name: localrag
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/local_ai_workspace}
    username: ${DB_USERNAME:local_ai}
    password: ${DB_PASSWORD:local_ai_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:qwen3:8b}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}
      init:
        pull-model-strategy: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

localrag:
  workspace:
    root-path: ${LOCALRAG_WORKSPACE_ROOT:C:/workspace}
  scan:
    max-file-size: 5MB
    include-extensions:
      - java
      - kt
      - cs
      - js
      - jsx
      - ts
      - tsx
      - py
      - c
      - cpp
      - h
      - hpp
      - sql
      - md
      - txt
      - yml
      - yaml
      - json
      - properties
      - xml
      - csv
      - log
      - html
      - css
      - gradle
      - kts
      - ps1
      - sh
    include-file-names:
      - Dockerfile
      - README
      - LICENSE
    common-exclude-directories:
      - .git
      - .github
      - .idea
      - .vscode
      - .gradle
      - .mvn
      - target
      - build
      - out
      - dist
      - node_modules
      - bin
      - obj
      - coverage
      - .cache
      - tmp
      - temp
      - venv
      - .venv
      - __pycache__
      - .next
      - .nuxt
      - vendor
    common-exclude-paths:
      - logs/archive
    unity-exclude-directories:
      - Library
      - Temp
      - Logs
      - UserSettings
      - MemoryCaptures
      - Recordings
      - Build
      - Builds
    exclude-file-patterns:
      - "*.class"
      - "*.jar"
      - "*.war"
      - "*.exe"
      - "*.dll"
      - "*.so"
      - "*.dylib"
      - "*.zip"
      - "*.rar"
      - "*.7z"
      - "*.tar"
      - "*.gz"
      - "*.png"
      - "*.jpg"
      - "*.jpeg"
      - "*.gif"
      - "*.webp"
      - "*.ico"
      - "*.mp3"
      - "*.wav"
      - "*.flac"
      - "*.mp4"
      - "*.avi"
      - "*.mov"
      - "*.mkv"
      - "*.ttf"
      - "*.otf"
      - "*.woff"
      - "*.woff2"
      - package-lock.json
      - yarn.lock
      - pnpm-lock.yaml
      - "*.asset"
    sensitive-file-patterns:
      - ".env"
      - ".env.*"
      - "application-prod.*"
      - "*.pem"
      - "*.key"
      - "*.p12"
      - "*.pfx"
      - "*credential*"
      - "*secret*"
      - "id_rsa"
      - "id_ed25519"
      - "*api-key*"
      - "*apikey*"
